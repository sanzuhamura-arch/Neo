services:
  - type: web
    name: neo-social-api
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DEVELOPER_USER_ID
        sync: false
      - key: JWT_SECRET
        generateValue: true

databases:
  - name: neo-social-db
    databaseName: neo_social
    user: neo_social
